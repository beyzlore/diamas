name: Haftalık araştırma
on:
  schedule:
    - cron: "0 8 * * 6"         # cumartesi UTC 08:00
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trade-takip
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Araştırma + rapor + PDF
        run: bash cloud/weekly.sh
      - name: Sonuçları kaydet
        run: |
          git config user.name "trade-takip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/ data/earnings.parquet data/fomc.parquet data/vix.parquet data/sp500.parquet data/universe.parquet rapor/
          git commit -m "Haftalık araştırma $(date -u +%F)" || echo "değişiklik yok"
          git pull --rebase -X ours && git push
      - run: bash cloud/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
