name: Günlük güncelleme
on:
  schedule:
    - cron: "30 21 * * 1-5"     # ABD kapanışından sonra (UTC 21:30)
  workflow_dispatch:
  push:
    paths: ["results/briefing.html"]   # günlük analiz yazılınca sayfayı yenile
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: diamas
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Veri + sanal portföy + pano
        run: python live/run_live.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "diamas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/ data/earnings.parquet data/fomc.parquet data/vix.parquet data/sp500.parquet rapor/takip.html
          git commit -m "Günlük güncelleme $(date -u +%F)" || echo "değişiklik yok"
          git pull --rebase -X ours && git push
      - run: bash cloud/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
